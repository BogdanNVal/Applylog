services:
  - type: web
    name: applylog
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APPLYLOG_SECRET_KEY
        generateValue: true
      - key: APPLYLOG_HTTPS_ONLY
        value: "1"
      # Set this in the Render dashboard to Neon's pooled URL.
      # DB lives off Render so a free instance doesn't need a disk.
      - key: APPLYLOG_DATABASE_URL
        sync: false
