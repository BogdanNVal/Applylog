# Local Postgres. docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: applylog-pg
    environment:
      POSTGRES_USER: applylog
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: applylog
    ports:
      # 5433 so it doesn't collide with a Postgres already on 5432.
      - "5433:5432"
    volumes:
      - applylog-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applylog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  applylog-pgdata:
