# Local Postgres for development and tests.
#   docker compose up -d
# The pgvector image is the same one CI uses, so semantic search later needs no
# change here.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: applylog-pg
    environment:
      POSTGRES_USER: applylog
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: applylog
    ports:
      # 5433 on the host, so it never fights a locally installed Postgres.
      - "5433:5432"
    volumes:
      - applylog-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applylog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  applylog-pgdata:
